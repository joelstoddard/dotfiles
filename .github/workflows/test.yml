name: test

on:
  pull_request:
    branches: [main]

jobs:
  flake:
    name: flake (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: joel@linux
            runner: ubuntu-latest
          - host: joel@linux-desktop
            runner: ubuntu-latest
          - host: joel@omarchy
            runner: ubuntu-latest
          - host: joel@macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd  # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate flake
        run: nix flake check --no-build
      - name: Dry-run build activation package
        run: nix build --dry-run '.#homeConfigurations."${{ matrix.host }}".activationPackage'

  unit:
    name: unit (autoenv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Run autoenv unit tests
        run: zsh test/unit/test_autoenv.sh
