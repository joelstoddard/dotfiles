name: test

on:
  pull_request:
    branches: [main]

jobs:
  flake:
    name: flake (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: joel@linux
            runner: ubuntu-latest
          - host: joel@linux-desktop
            runner: ubuntu-latest
          - host: joel@omarchy
            runner: ubuntu-latest
          - host: joel@macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      # Home Manager activation compiles this with the system swiftc, which no Nix step runs.
      - name: Type-check the Claude notifier
        if: matrix.host == 'joel@macos'
        run: swiftc -typecheck home/files/claude/claude-notify.swift
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd  # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check Nix formatting
        if: matrix.host == 'joel@linux'
        run: nix fmt -- --ci
      - name: Evaluate flake
        run: nix flake check --no-build
      - name: Dry-run build activation package
        run: nix build --dry-run '.#homeConfigurations."${{ matrix.host }}".activationPackage'

  unit:
    name: unit (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install zsh and PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          pip install pyyaml
      - name: Run shell and Python unit tests
        run: bash test/unit/run.sh
      - name: Check coverage floors
        run: bash test/coverage.sh
      - name: Check coverage floors only rise
        run: |
          git fetch --depth=1 origin main
          if git cat-file -e FETCH_HEAD:test/coverage-floor.tsv 2>/dev/null; then
            git show FETCH_HEAD:test/coverage-floor.tsv > "$RUNNER_TEMP/base-floor.tsv"
            bash test/coverage.sh --ratchet "$RUNNER_TEMP/base-floor.tsv"
          else
            echo "main has no coverage floors yet; nothing to compare"
          fi
