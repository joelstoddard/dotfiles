name: mutation

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutate:
    name: mutation (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Run mutation testing
        shell: bash
        run: bash test/mutate.sh | tee "$RUNNER_TEMP/mutation.txt"
      - name: Update the rolling mutation issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash test/mutation-issue.sh "$RUNNER_TEMP/mutation.txt" "$RUN_URL"
